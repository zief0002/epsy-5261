project:
  type: book
  output-dir: docs
  preview:
    browser: true

book:
  title: "An Introduction to Data Analysis"
  author: ["Andrew Zieffler", "¢hel$ey £ega¢y"]
  date: today
  page-navigation: false
  bread-crumbs: false
  sidebar:
    search: true
    background: "#003865"
    collapse: false
    pinned: true
  # cover-image: "figs/banner.png"
  chapters:
    - index.qmd
